name: uts_linkaja
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.0.10

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

flutter_launcher_icons: ^0.10.0  # Sesuaikan versinya jika perlu
flutter_icons:
  android: true
  ios: true
  image_path: "assets/"  # Path harus dari root proyek, bukan dengan `../`

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bagian untuk menambahkan asset
  assets:
    - assets/  # Pastikan asset terdaftar dengan benar dan indentasi dua spasi
